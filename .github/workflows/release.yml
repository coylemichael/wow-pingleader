# Publishing a GitHub Release checks the Lua, packages the addon with the
# BigWigsMods packager, uploads the ZIP to CurseForge and attaches it to the
# release. CurseForge is skipped until the TOC has "## X-Curse-Project-ID".
# "Run workflow" (manual) builds the ZIP as an artifact and uploads nothing.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check Lua syntax
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes -qq lua5.1
          find . -name '*.lua' -not -path './.*' -print0 | xargs -0 luac5.1 -p

      - name: Check CurseForge setup
        if: github.event_name == 'release'
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_KEY }}
        run: |
          if grep -q '^## X-Curse-Project-ID:' *.toc && [ -z "$CF_API_TOKEN" ]; then
            echo "::error::The TOC names a CurseForge project, but the CF_API_KEY secret is not set."
            exit 1
          fi

      - name: Package and upload
        uses: BigWigsMods/packager@v2.7.0
        with:
          args: ${{ github.event_name != 'release' && '-d' || '' }}
          pandoc: 'false'
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_KEY }}
          GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v7
        if: github.event_name != 'release'
        with:
          name: addon-zip
          path: .release/*.zip
          include-hidden-files: true
